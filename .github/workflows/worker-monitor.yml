name: Worker monitoring
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: clarivia-worker-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check worker alerts and deliver repository incidents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/worker-monitor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-monitor-${{ github.run_id }}
          path: .tmp-tests/worker-monitor.json
          retention-days: 7
