name: Final operational acceptance
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clarivia-final-operational-acceptance
  cancel-in-progress: false
jobs:
  restore:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-final-acceptance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-restore-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: staging
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read-only staging backup and isolated runner restore
        env:
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/restore-exercise.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-restore-${{ github.run_id }}
          path: .tmp-tests/restore-report.json
          retention-days: 7
  workload:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-final-acceptance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      APP_ENVIRONMENT: staging
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      STAGING_APP_RW_PASSWORD: ${{ secrets.STAGING_APP_RW_PASSWORD }}
      STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://qbogvclmehvrtuwiktos.supabase.co
      # Publishable client key, never a server credential.
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aBOkDiRMJbnJocrWSx95PA_UDd1UF4O
      AI_ENABLED: 'false'
      JIRA_WRITE_ENABLED: 'false'
      ACCEPTANCE_DURATION_SECONDS: '1800'
      EXPECTED_RELEASE: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate test-account provisioning credential exists
        run: test -n "$STAGING_SUPABASE_SECRET_KEY"
      - run: npm ci
      - run: node scripts/prepare-staging-database-url.mjs
      - name: Bound runner connection pool and generate ephemeral worker credential
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          const url=new URL(process.env.DATABASE_URL);url.searchParams.set('connection_limit','10');
          appendFileSync(process.env.GITHUB_ENV,`DATABASE_URL=${url}\nBACKGROUND_WORKER_SECRET=${randomBytes(32).toString('hex')}\n`);
          JS
      - run: npm run build
      - name: Wait for the final production code release, then start isolated staging production build
        run: |
          node --input-type=module - <<'JS'
          const { execFileSync } = await import('node:child_process');
          const tooling = new Set(['scripts/staging-acceptance.ts','.github/workflows/ci.yml','.github/workflows/operational-acceptance.yml','.github/workflows/worker-monitor.yml']);
          for(let attempt=0;attempt<30;attempt++){
            const result=await fetch('https://www.nextgendepot.online/api/ready').then(r=>r.json()).catch(()=>null);
            const deployed=result?.release?.commit;
            if(deployed && /^[a-f0-9]{40}$/.test(deployed)) {
              try {
                const changes=execFileSync('git',['diff','--name-only',deployed,process.env.EXPECTED_RELEASE],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
                if(changes.every(path=>tooling.has(path))) {console.log(`Production application identity verified: ${deployed}; only acceptance tooling differs.`);process.exit(0);}
              } catch { /* Wait for the expected application release. */ }
            }
            await new Promise(resolve=>setTimeout(resolve,20000));
          }
          throw new Error('Final production release identity was not observed; workload was not started.');
          JS
          npm run start -- --hostname 127.0.0.1 > .tmp-acceptance-server.log 2>&1 &
          echo "$!" > .tmp-acceptance-server.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify real signed-in roles, bounded AI user decisions and 20-user 30-minute workload
        run: npx tsx scripts/staging-acceptance.ts
      - name: Stop the owned acceptance server
        if: always()
        run: |
          if test -f .tmp-acceptance-server.pid; then kill "$(cat .tmp-acceptance-server.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-workload-${{ github.run_id }}
          path: .tmp-tests/staging-acceptance.json
          retention-days: 7
